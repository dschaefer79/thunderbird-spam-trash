<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; margin: 12px; width: 300px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  td { padding: 3px 0; border-bottom: 1px solid #8883; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  button { width: 100%; padding: 8px; font-weight: 600; border: 0; border-radius: 4px;
           background: #d93025; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
  <h1>Empty Spam &amp; Trash</h1>
  <table id="list"><tr><td>Scanning folders…</td></tr></table>
  <button id="go" disabled>Delete all permanently</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
